services:
  floci:
    image: floci/floci:1.5.11
    ports:
      - "${FLOCI_HOST_PORT:-4566}:4566"
    environment:
      FLOCI_HOSTNAME: floci
      FLOCI_PORT: 4566
      FLOCI_STORAGE_MODE: memory
      # Athena mock mode (DuckDB sidecar não funciona no Windows)
      FLOCI_SERVICES_ATHENA_MOCK: "true"
    volumes:
      - //./pipe/docker_engine:/var/run/docker.sock
    cap_add:
      - NET_RAW
      - NET_BIND_SERVICE
    privileged: true

  # floci-duck sidecar para Athena (alternativa ao mock)
  # Descomente para Linux/macOS: docker compose --profile athena up -d
  athena:
    image: floci/floci-duck:latest
    profiles: ["athena"]
    ports:
      - "3000:3000"
    environment:
      FLOCI_DUCK_PORT: "3000"
      FLOCI_DUCK_S3_ENDPOINT: http://floci:4566
      FLOCI_DUCK_S3_ACCESS_KEY: test
      FLOCI_DUCK_S3_SECRET_KEY: test
      FLOCI_DUCK_S3_REGION: us-east-1

  tools:
    build:
      context: .
      dockerfile: docker/tools/Dockerfile
    profiles: ["tools"]
    depends_on:
      floci:
        condition: service_healthy
    working_dir: /workspace
    volumes:
      - .:/workspace:ro
    env_file:
      - .env

  glue:
    image: public.ecr.aws/glue/aws-glue-libs:5
    profiles: ["glue"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    working_dir: /home/hadoop/workspace
    volumes:
      - .:/home/hadoop/workspace
    env_file:
      - .env
