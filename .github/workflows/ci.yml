# CI-01, CI-02, CI-03, IAC-04: Sequential lint → terraform → test pipeline.
# OIDC deferred to v2 — AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY via secrets.
name: CI

"on":
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .env
        run: cp .env.example .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Small deps caching (ruff, pytest, boto3) via actions/cache standard
      - name: Cache Python tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.local/lib/python*/site-packages
          key: ${{ runner.os }}-pytools-${{ hashFiles('requirements.txt', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pytools-

      - name: Lint
        run: ./run.sh lint

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9

      - name: Terraform init
        run: terraform init -backend=false infra/
        env:
          # No credentials needed — offline validation (IAC-04)
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform validate
        run: terraform validate

  # DX-03.1: Unit tests (no Spark/AWS required)
  test-unit:
    name: Test Unit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Python tools
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pytools-${{ hashFiles('requirements.txt', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pytools-

      - name: Install dependencies
        run: pip install pytest pytest-mock boto3 pyspark

      - name: Run unit tests
        run: pytest tests/unit/ -v

  # DX-03.2: Integration tests (requires Floci)
  test-integration:
    name: Test Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .env
        run: |
          cp .env.example .env
          echo "AWS_ENDPOINT_URL=http://localhost:4566" >> .env

      - name: Start Floci
        run: docker run -d --name floci -p 4566:4566 floci/floci:1.5.11

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Python tools
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pytools-${{ hashFiles('requirements.txt', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pytools-

      - name: Install dependencies
        run: pip install pytest boto3 pyspark

      # Floci may need time to initialize; wait for health endpoint
      - name: Wait for Floci to be ready
        run: |
          for i in {1..30}; do
            curl -s http://localhost:4566/_localstack/health > /dev/null 2>&1 && exit 0
            sleep 2
          done
          exit 1

      - name: Run integration tests
        run: pytest tests/integration/ -v --ignore=tests/integration/test_job.py
        env:
          AWS_ENDPOINT_URL: http://localhost:4566
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
          PROJECT_NAME: template_etl

      - name: Seed sample data
        run: python catalog/seed.py
        env:
          AWS_ENDPOINT_URL: http://localhost:4566
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
          PROJECT_NAME: template_etl

      - name: Run pytest suite
        run: pytest tests/integration/ -v --ignore=tests/integration/test_job.py
        env:
          AWS_ENDPOINT_URL: http://localhost:4566
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
          PROJECT_NAME: template_etl

      - name: Fix endpoint for Glue container
        run: sed -i 's|AWS_ENDPOINT_URL=.*|AWS_ENDPOINT_URL=http://host.docker.internal:4566|' .env

      - name: Run ETL job
        run: docker compose --profile glue run --rm --add-host host.docker.internal:host-gateway glue spark-submit jobs/csv_to_parquet/job.py --JOB_NAME csv_to_parquet

      - name: Cleanup Floci
        if: always()
        run: docker rm -f floci || true
