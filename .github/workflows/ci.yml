# CI-01, CI-02, CI-03, IAC-04: Sequential lint → terraform → test pipeline.
# OIDC deferred to v2 — AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY via secrets.
name: CI

"on":
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Small deps caching (ruff, pytest, boto3) via actions/cache standard
      - name: Cache Python tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.local/lib/python*/site-packages
          key: ${{ runner.os }}-pytools-${{ hashFiles('requirements.txt', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pytools-

      - name: Lint
        run: ./run.sh lint

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9

      - name: Terraform init
        run: terraform init -backend=false
        env:
          # No credentials needed — offline validation (IAC-04)
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform validate
        run: terraform validate

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Glue image caching (~4.77 GB) between runs (D-01)
      # Note: Using floating tag :5. Consider pinning to a specific digest for production
      # reproducibility, e.g., public.ecr.aws/glue/aws-glue-libs:5@sha256:<digest>
      - name: Cache Glue image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: false
          push: false
          tags: public.ecr.aws/glue/aws-glue-libs:5
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Small deps caching
      - name: Cache Python tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.local/lib/python*/site-packages
          key: ${{ runner.os }}-pytools-${{ hashFiles('requirements.txt', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pytools-

  # Full pipeline: bootstrap catalog → seed data → run job → run tests (CI-02, CI-03)
      - name: Bootstrap catalog
        run: ./run.sh bootstrap
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  # DX-03.1, DX-03.2: Unit tests (no Spark/AWS required)
  test-unit:
    name: Test Unit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Python tools
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pytools-${{ hashFiles('requirements.txt', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pytools-

      - name: Install dependencies
        run: pip install pytest pytest-mock boto3 pyspark

      - name: Run unit tests
        run: pytest tests/unit/ -v

  # DX-03.2: Integration tests (requires Floci)
  test-integration:
    name: Test Integration
    runs-on: ubuntu-latest
    services:
      floci:
        image: ghcr.io/arc54/floci:latest
        ports:
          - 4566:4566
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Python tools
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pytools-${{ hashFiles('requirements.txt', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pytools-

      - name: Install dependencies
        run: pip install pytest boto3 pyspark

      - name: Run integration tests
        run: pytest tests/integration/ -v --ignore=tests/integration/test_job.py
        env:
          AWS_ENDPOINT_URL: http://localhost:4566
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1

      - name: Seed sample data
        run: ./run.sh seed
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Run job
        run: ./run.sh job
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Run pytest suite
        run: ./run.sh test
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
