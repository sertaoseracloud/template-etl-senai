# CI-01, CI-02, CI-03, IAC-04: Sequential lint → terraform → test pipeline.
# OIDC deferred to v2 — AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY via secrets.
name: CI

"on":
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .env
        run: cp .env.example .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Small deps caching (ruff, pytest, boto3) via actions/cache standard
      - name: Cache Python tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.local/lib/python*/site-packages
          key: ${{ runner.os }}-pytools-${{ hashFiles('requirements.txt', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pytools-

      - name: Lint
        run: ./run.sh lint

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9

      - name: Terraform init
        run: terraform init -backend=false infra/
        env:
          # No credentials needed — offline validation (IAC-04)
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform validate
        run: terraform validate

  # Legacy/placeholder job removed — it was partially implemented with no actual test steps.
  # The actual integration testing is handled by the test-integration job below.
  # TODO: Either remove this comment block or complete the implementation if needed.

  # DX-03.1, DX-03.2: Unit tests (no Spark/AWS required)
  test-unit:
    name: Test Unit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Python tools
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pytools-${{ hashFiles('requirements.txt', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pytools-

      - name: Install dependencies
        run: pip install pytest pytest-mock boto3 pyspark

      - name: Run unit tests
        run: pytest tests/unit/ -v

  # DX-03.2: Integration tests (requires Floci)
  test-integration:
    name: Test Integration
    runs-on: ubuntu-latest
    services:
      floci:
        image: floci/floci:1.5.11
        ports:
          - 4566:4566
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .env
        run: |
          cp .env.example .env
          # Use localhost for Floci since it's exposed as GitHub Actions service
          echo "AWS_ENDPOINT_URL=http://localhost:4566" >> .env

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Python tools
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pytools-${{ hashFiles('requirements.txt', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pytools-

      - name: Install dependencies
        run: pip install pytest boto3 pyspark

      # Floci may need time to initialize; wait for health endpoint
      - name: Wait for Floci to be ready
        run: |
          for i in {1..30}; do
            curl -s http://localhost:4566/_localstack/health > /dev/null 2>&1 && exit 0
            sleep 2
          done
          exit 1

      - name: Run integration tests
        run: pytest tests/integration/ -v --ignore=tests/integration/test_job.py
        env:
          AWS_ENDPOINT_URL: http://localhost:4566
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
          PROJECT_NAME: template_etl

      - name: Seed sample data
        run: ./run.sh seed
        env:
          CI: true
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Run job
        run: ./run.sh job
        env:
          CI: true
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Run pytest suite
        run: ./run.sh test
        env:
          CI: true
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
