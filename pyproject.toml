[tool.ruff]
target-version = "py311"
line-length = 100
# .planning/ holds prose research/planning docs, not project source. ruff
# 0.16 formats Python code fences embedded in Markdown by default, which
# would otherwise make `./run.sh lint` fail on documentation instead of code.
extend-exclude = [".planning"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "C4", "SIM", "PTH"]
